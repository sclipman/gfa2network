name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.12', '3.14']
        extras: ['', 'igraph,tqdm']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and tests
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          if [ -n "$EXTRAS" ]; then
            python -m pip install -e ".[${EXTRAS}]" pytest
          else
            python -m pip install -e . pytest
          fi
      - name: Exercise optional DataFrame results
        if: matrix.python == '3.12' && matrix.extras != ''
        run: python -m pip install pandas
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,igraph,tqdm]"
      - run: bash scripts/lint_check.sh
      - run: python -m build
