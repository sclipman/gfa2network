[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gfa2network"
dynamic = ["version"]
description = "Convert GFA pangenome graphs to NetworkX graphs or SciPy matrices"
authors = [{name = "Steven J. Clipman"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "networkx",
    "scipy",
    "numpy",
]


[project.optional-dependencies]
tqdm = ["tqdm"]
igraph = ["python-igraph>=0.11"]
test = ["pytest"]
dev = ["pytest", "ruff", "build"]

[project.scripts]
gfa2network = "gfa2network.cli:main"

[tool.setuptools.packages.find]
include = ["gfa2network"]
exclude = ["assets", "scripts", "tests"]

[tool.setuptools.dynamic]
version = {attr = "gfa2network.version.__version__"}

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
